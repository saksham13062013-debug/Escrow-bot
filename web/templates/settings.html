{% extends "base.html" %}
{% block title %}Settings — MM Escrow{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Settings</h1>

<form method="post" action="/settings" class="bg-white rounded-xl shadow p-6 max-w-xl space-y-5">
  <div>
    <label class="block text-sm font-medium mb-1">Platform Fee (%)</label>
    <input type="number" step="0.1" name="fee" value="{{ fee }}" class="w-full border rounded-lg px-3 py-2">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Support Contact</label>
    <input type="text" name="support" value="{{ support }}" class="w-full border rounded-lg px-3 py-2">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Default Crypto Wallet</label>
    <textarea name="crypto_wallet" rows="2" class="w-full border rounded-lg px-3 py-2 font-mono text-sm">{{ crypto_wallet }}</textarea>
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Default UPI ID</label>
    <input type="text" name="upi" value="{{ upi }}" class="w-full border rounded-lg px-3 py-2 font-mono">
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Min Amount</label>
      <input type="text" name="min_amount" value="{{ min_amount }}" class="w-full border rounded-lg px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Max Amount</label>
      <input type="text" name="max_amount" value="{{ max_amount }}" class="w-full border rounded-lg px-3 py-2">
    </div>
  </div>
  <div class="flex items-center gap-2">
    <input type="checkbox" name="maintenance" value="1" id="maint" {% if maintenance %}checked{% endif %}>
    <label for="maint" class="text-sm">Enable Maintenance Mode</label>
  </div>
  <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-medium">
    Save Settings
  </button>
</form>
{% endblock %}
