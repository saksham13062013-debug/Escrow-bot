<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MM Escrow Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-2">🛡 MM Escrow</h1>
    <p class="text-gray-500 text-center mb-6">Admin Panel Login</p>
    {% if error %}
    <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <label class="block text-sm font-medium mb-1">Admin Secret</label>
      <input type="password" name="secret" required
             class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:ring-2 focus:ring-blue-500 outline-none"
             placeholder="Enter ADMIN_SECRET">
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">
        Login
      </button>
    </form>
  </div>
</body>
</html>
